<body>
  <header>
    <div class="header-container">
        <h1><a href="/home/">H I GREEN</a></h1>
      <nav aria-label="Primary Navigation">
        <ul class="nav-list">
          <li><a href="/home/">Home</a></li>
          <li><a href="/works/">Works</a></li>
          <li><a href="/cv/">CV</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="prints" aria-labelledby="prints-heading">
      <h2 id="prints-heading">Contact</h2>
     <div class="prints-grid">
     
     <!-- <h3 style="text-align: center;">Prints to come.</h3>-->
     </div>
      <!-- <div class="prints-grid">
        <div class="print-item">
          <img src="/images/print1.webp" alt="Print 1: [brief description of the print]" />
        </div>
        <div class="print-item">

        </div>
        <div class="print-item">
          <img src="/images/print3.webp" alt="Print 3: [brief description of the print]" />

    </section>
    <form action="https://formspree.io/f/mdkawgko" method="POST">
      <div class="contact-info">
        <h3>Inquiries?</h3>
        <div class="form-group">
          <label for="name">Your Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Your Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      
      <button type="submit">Send Message</button>
    </form>
  </main>
