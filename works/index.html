  <script>
    // Accordion Toggle Functionality with ARIA updates
    document.addEventListener("DOMContentLoaded", function() {
      const accButtons = document.getElementsByClassName("accordion-button");
      Array.from(accButtons).forEach(button => {
        button.addEventListener("click", function() {
          // Toggle active state and aria-expanded attribute
          const isExpanded = this.getAttribute("aria-expanded") === "true";
          this.setAttribute("aria-expanded", !isExpanded);
          this.classList.toggle("active");
  
          // Toggle the corresponding panel's max-height for smooth animation
          const panel = this.nextElementSibling;
          if (panel.style.maxHeight) {
            panel.style.maxHeight = null;
          } else {
            panel.style.maxHeight = panel.scrollHeight + "px";
          }
        });
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Get modal elements
      const modal = document.getElementById("lightbox-modal");
      const modalImg = document.querySelector(".lightbox-content");
      const closeBtn = document.querySelector(".lightbox-modal .close");
      
      // Open modal when any gallery image is clicked
      document.querySelectorAll(".gallery img").forEach(img => {
        img.addEventListener("click", function() {
          modal.style.display = "flex";
          modalImg.src = this.src;
        });
      });
      
      // Close modal when close button is clicked
      closeBtn.addEventListener("click", function() {
        modal.style.display = "none";
      });
      
      // Close modal when clicking outside the image
      modal.addEventListener("click", function(e) {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });
    });
  </script>
  <div id="lightbox-modal" class="lightbox-modal">
    <span class="close">&times;</span>
    <img class="lightbox-content" src="" alt="Expanded work">
  </div>
